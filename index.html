<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InvoiceBook — Τιμολόγια</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/app.css">
</head>
<body class="electron">

<!-- CUSTOM TITLEBAR + ΜΕΝΟΥ (ενοποιημένα σε μία μπάρα — πριν ήταν δύο στοιβαγμένες navy μπάρες με διπλό λογότυπο) -->
<div id="titlebar">
  <div id="titlebar-drag">📔 InvoiceBook</div>
  <nav class="topnav">
    <div class="nav-item active" data-page="import" onclick="navigateTo('import')">Εισαγωγή</div>
    <div class="nav-item" data-page="dashboard" onclick="navigateTo('dashboard')">Πίνακας Ελέγχου</div>
    <div class="nav-item" data-page="invoices" onclick="navigateTo('invoices')">Τιμολόγια</div>
    <div class="nav-item" data-page="pools" onclick="navigateTo('pools')">Αποθέματα</div>
    <div class="nav-item" data-page="browse" onclick="navigateTo('browse')">Περιήγηση</div>
    <div class="nav-item" data-page="explosives" onclick="navigateTo('explosives')">💥 Εκρηκτικά</div>
    <div class="nav-item" data-page="suppliers" onclick="navigateTo('suppliers')">Προμηθευτές</div>
    <div class="nav-item" data-page="merges" onclick="navigateTo('merges')">Συγχωνεύσεις</div>
  </nav>
  <div id="titlebar-btns">
    <button onclick="window.api.minimize()" title="Ελαχιστοποίηση">─</button>
    <button onclick="window.api.maximize()" title="Μεγιστοποίηση">□</button>
    <button id="tb-close" onclick="window.api.close()" title="Κλείσιμο">✕</button>
  </div>
</div>

<!-- MAIN CONTENT -->
<main class="main">
  <div id="page-container"></div>
</main>

<!-- TOASTS -->
<div id="toast-container" style="position:fixed; top:48px; right:20px; z-index:500; display:flex; flex-direction:column; gap:8px;"></div>

<!-- CONFIRM MODAL -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal" style="max-width:420px;">
    <div class="modal-title">Επιβεβαίωση</div>
    <p id="confirm-msg" style="margin-bottom:8px;"></p>
    <div class="modal-actions">
      <button class="btn btn-outline" id="confirm-cancel-btn">Άκυρο</button>
      <button class="btn btn-danger" id="confirm-ok-btn">Επιβεβαίωση</button>
    </div>
  </div>
</div>

<script type="module" src="./js/main-app.js"></script>
</body>
</html>
